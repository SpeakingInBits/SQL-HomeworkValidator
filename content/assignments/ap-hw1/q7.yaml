title: Invalid payment dates
prompt: |
  Write a SELECT statement that determines whether the PaymentDate column of the
  Invoices table has any invalid values. To be valid, PaymentDate must be a null
  value if there's a balance due and a non-null value if there's no balance due.
  Code a compound condition in the WHERE clause that tests for these conditions.
# The question doesn't say which columns to return, so only the number of rows is compared.
# The base data has no invalid rows; the edge dataset (milestone 2) will add some.
compare:
  columns: row-count
rules:
  require: [Where]
hints:
  edge: The edge data has both kinds of invalid row, and an invoice paid entirely by a credit. Remember that credits reduce the balance due too.

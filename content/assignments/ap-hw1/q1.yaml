title: Vendor contacts sorted by name
prompt: |
  Write a SELECT statement that returns three columns from the Vendors table:
  VendorContactFName, VendorContactLName, and VendorName. Sort the result set by
  last name, then by first name. (This should be answered with a single query.)
compare:
  order: [VendorContactLName, VendorContactFName]
hints:
  edge: Two contacts share the last name Ellis. Within the same last name, sort by first name.

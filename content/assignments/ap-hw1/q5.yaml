title: Invoice balances between $500 and $10,000
prompt: |
  Modify the solution to exercise 2 to filter for invoices with an InvoiceTotal
  that's greater than or equal to $500 but less than or equal to $10,000.
rules:
  forbid: [AliasWithoutAs]
hints:
  edge: Check invoices that total exactly $500 and exactly $10,000. "Greater than or equal to" includes them.

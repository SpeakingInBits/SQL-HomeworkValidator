title: Item price and discount totals by customer
prompt: |
  Write a SELECT statement that returns one row for each customer that has orders, with
  these columns:

    The EmailAddress column from the Customers table
    The sum of the item price in the OrderItems table multiplied by the quantity in the
    OrderItems table
    The sum of the discount amount column in the OrderItems table multiplied by the
    quantity in the OrderItems table

  Sort the result set in descending sequence by the item price total for each customer.
note: The question doesn't name the columns, so only their order is checked.
compare:
  columns: by-position
  order: [ItemPriceTotal]

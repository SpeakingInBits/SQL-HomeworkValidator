title: Shipped and unshipped orders
prompt: |
  Use the UNION operator to generate a result set consisting of three columns from the
  Orders table:

    ShipStatus  A calculated column that contains a value of SHIPPED or NOT SHIPPED
    OrderID     The OrderID column
    OrderDate   The OrderDate column

  If the order has a value in the ShipDate column, the ShipStatus column should contain
  a value of SHIPPED. Otherwise, it should contain a value of NOT SHIPPED.

  Sort the final result set by OrderDate.
compare:
  order: [OrderDate]
rules:
  require: [Union]

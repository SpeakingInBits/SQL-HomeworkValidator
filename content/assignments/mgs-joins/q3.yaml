title: Customers' shipping addresses
prompt: |
  Write a SELECT statement that joins the Customers table to the Addresses table and
  returns these columns: FirstName, LastName, Line1, City, State, ZipCode.

  Return one row for each customer, but only return addresses that are the shipping
  address for a customer.
hints:
  edge: >-
    The edge data has customers with no shipping address. They have no shipping address to return,
    so leave them out.

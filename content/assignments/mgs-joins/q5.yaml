title: Products that share a list price
prompt: |
  Write a SELECT statement that returns the ProductName and ListPrice columns from the
  Products table.

  Return one row for each product that has the same list price as another product.
  (Hint: Use a self-join to check that the ProductID columns aren't equal but the
  ListPrice column is equal.)

  Sort the result set by ProductName.
compare:
  order: [ProductName]
hints:
  edge: >-
    The edge data has three products with the same list price, so each one matches two others.
    Return each product only once.

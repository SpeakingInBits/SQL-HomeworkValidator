name: Password store

# "Remember my password" calls each operating system's own password store, so its tests run on each one, against the real
# store. They run only when that code changes; CI's Linux job skips them because it has no keyring.
on:
  pull_request:
    branches: [main]
    paths:
      - src/HomeworkValidator.App/Services/*PasswordStore.cs
      - tests/HomeworkValidator.App.Tests/PasswordStoreTests.cs
      - .github/workflows/password-store.yml

permissions:
  contents: read

jobs:
  password-store:
    name: password-store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fail instead of skipping when the store can't be reached.
      HV_EXPECT_PASSWORD_STORE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install a keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11

      # Linux needs a D-Bus session with an unlocked keyring, as a desktop login would provide.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            dotnet test tests/HomeworkValidator.App.Tests --filter "Category=PasswordStore"
          '

      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test tests/HomeworkValidator.App.Tests --filter "Category=PasswordStore"
